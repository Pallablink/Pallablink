<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Pallab Jyoti Das - Founder and Full-Stack Software Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1325"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweepLine" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="900" height="240" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Dark Canvas -->
    <rect width="900" height="240" fill="url(#bgGrad)"/>
    <rect width="900" height="240" fill="url(#grid)"/>

    <!-- Ambient Animated Glow Orbs -->
    <circle cx="180" cy="70" r="180" fill="url(#glowLeft)">
      <animate attributeName="cx" values="160;230;160" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="65;95;65" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="175" r="170" fill="url(#glowRight)">
      <animate attributeName="cx" values="740;680;740" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="175;140;175" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- Subtle Floating Tech Nodes -->
    <circle cx="88" cy="54" r="2.2" fill="#38BDF8" opacity="0.55">
      <animate attributeName="cy" values="54;42;54" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.8;0.25" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="812" cy="48" r="2.5" fill="#818CF8" opacity="0.55">
      <animate attributeName="cy" values="48;60;48" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="196" r="2" fill="#38BDF8" opacity="0.45">
      <animate attributeName="cx" values="760;776;760" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.75;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- Decorative Right-Side Orbital Rings -->
    <g transform="translate(790, 120)" opacity="0.35">
      <circle r="54" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="6 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      </circle>
      <circle r="38" fill="none" stroke="#818CF8" stroke-width="1" stroke-dasharray="4 6">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle r="18" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.65"/>
      <circle r="4" fill="#38BDF8">
        <animate attributeName="r" values="3.5;5;3.5" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Top & Bottom Animated Accent Sweep -->
    <rect x="0" y="0" width="900" height="2.5" fill="#1E293B"/>
    <rect x="0" y="0" width="900" height="2.5" fill="url(#sweepLine)"/>
    <rect x="0" y="237.5" width="900" height="2.5" fill="#1E293B"/>
    <rect x="0" y="237.5" width="900" height="2.5" fill="url(#sweepLine)"/>

    <!-- Status Pill -->
    <g transform="translate(56, 44)">
      <rect x="0" y="0" width="268" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <circle cx="18" cy="14" r="4" fill="#22C55E">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="18" cy="14" r="4" fill="none" stroke="#22C55E" stroke-width="1.5">
        <animate attributeName="r" values="4;10" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8" fill="#94A3B8">
        AMSNIEX  ·  ASSAM, INDIA
      </text>
    </g>

    <!-- Name & Role Typography -->
    <text x="56" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="url(#textGrad)">
      Pallab Jyoti Das
    </text>

    <text x="58" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#94A3B8">
      Founder  ·  Entrepreneur  ·  Full-Stack Software Engineer
    </text>

    <!-- Animated Signal Pulse Bar -->
    <rect x="56" y="188" width="140" height="3" rx="1.5" fill="#1E293B"/>
    <rect x="56" y="188" width="64" height="3" rx="1.5" fill="#38BDF8">
      <animate attributeName="x" values="56;132;56" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="0.5" y="0.5" width="899" height="239" rx="16" ry="16" fill="none" stroke="#1E293B" stroke-width="1"/>
</svg>
