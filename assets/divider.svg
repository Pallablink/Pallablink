<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 6" width="900" height="6" role="presentation">
  <defs>
    <linearGradient id="divSweep" x1="-60%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
      <animate attributeName="x1" values="-60%;100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;160%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="2" width="900" height="2" rx="1" fill="#1E293B" opacity="0.6"/>
  <rect x="0" y="2" width="900" height="2" rx="1" fill="url(#divSweep)"/>
</svg>
